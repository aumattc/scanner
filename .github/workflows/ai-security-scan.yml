name: AI Security & Syntax Audit

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Enables manual trigger from GitHub UI

jobs:
  scan-and-refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gemini Scanner
        uses: .github-action
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          target_language: 'php'

      - name: Create Pull Request with Fixes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "refactor: auto-apply Gemini security patches"
          title: "🤖 Gemini AI Refactoring & Vulnerability Fixes"
          body: |
            This Pull Request was automatically generated by the Gemini Flash-Lite scanner.
            It refactors legacy syntax and addresses potential security vulnerabilities.
          branch: "gemini-refactor-patch"
          base: "main"